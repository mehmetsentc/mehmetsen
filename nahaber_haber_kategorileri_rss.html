// Build tabs
const tabBar = document.getElementById('tabBar');
const mainContent = document.getElementById('mainContent');

categories.forEach((cat, idx) => {
  const tab = document.createElement('div');
  tab.className = 'tab' + (idx === 0 ? ' active' : '');
  tab.textContent = cat.label;
  tab.style.background = cat.color;
  tab.style.color = '#fff';
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('sec-' + cat.id).classList.add('active');
  };
  tabBar.appendChild(tab);

  const sec = document.createElement('div');
  sec.className = 'section' + (idx === 0 ? ' active' : '');
  sec.id = 'sec-' + cat.id;

  const title = document.createElement('div');
  title.className = 'section-title';
  title.style.background = cat.color;
  title.textContent = cat.title;
  sec.appendChild(title);

  if (cat.isGrid) {
    const grid = document.createElement('div');
    grid.className = 'ozet-grid';
    cat.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'ozet-card';
      card.style.borderColor = item.color;
      card.innerHTML = `<h3 style="color:${item.color}">${item.num}. ${item.name}</h3><p>${item.desc}</p>`;
      grid.appendChild(card);
    });
    sec.appendChild(grid);
  } else {
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    tr.style.background = cat.thColor;
    cat.cols.forEach(col => {
      const th = document.createElement('th');
      th.textContent = col;
      th.style.background = cat.thColor;
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    cat.rows.forEach((row, ri) => {
      const tr2 = document.createElement('tr');
      row.forEach((cell, ci) => {
        const td = document.createElement('td');
        if (ci === 2) {
          const a = document.createElement('a');
          a.href = cell;
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = cell;
          td.appendChild(a);
        } else if (ci === 3) {
          td.innerHTML = cell;
        } else {
          td.textContent = cell;
          if (ci === 0) td.className = 'cat';
        }
        tr2.appendChild(td);
      });
      tbody.appendChild(tr2);
    });
    table.appendChild(tbody);
    sec.appendChild(table);
  }

  mainContent.appendChild(sec);
});
