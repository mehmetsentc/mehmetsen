<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P17c Feed highlights measure</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
    .card {
      width: 390px; height: 844px; margin: 0 auto; position: relative; overflow: hidden;
      background: linear-gradient(#1a1a1a, #000);
    }
    .chrome {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 12px 14px max(16px, env(safe-area-inset-bottom));
      padding-right: 3.5rem;
      background: linear-gradient(to top, #000, rgba(0,0,0,.92), transparent);
    }
    .summary {
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
      font-size: 15px; line-height: 1.45; color: rgba(255,255,255,.9); margin: 0 0 12px;
    }
    .hl-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .hl-title { font-size: 12px; font-weight: 800; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .see { font-size: 11px; color: rgba(255,255,255,.55); border: 0; background: transparent; color: inherit; }
    .rail { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
    .tile {
      flex: 0 0 calc((100% - 1.25rem) / 2.2);
      border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.55);
    }
    .media { aspect-ratio: 16/10; background: #333; }
    .meta { padding: 6px 8px 8px; min-height: 3.75rem; }
    .cat { font-size: 9px; font-weight: 800; color: #e11d2e; letter-spacing: .06em; }
    .tile-hl { margin: 4px 0 0; font-size: 11px; font-weight: 700; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cta {
      margin-top: 12px; height: 56px; width: 100%; border: 0; border-radius: 999px;
      background: #f5c6cf; color: #111; font-weight: 800;
    }
    .social { position: absolute; right: 8px; bottom: 140px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .social span { width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,.12); }
    #out { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: rgba(0,0,0,.85); color: #86efac; font: 11px/1.35 ui-monospace,monospace; padding: 6px 8px; white-space: pre-wrap; max-height: 38vh; overflow: auto; }
  </style>
</head>
<body>
  <pre id="out">measuring…</pre>
  <div class="card" data-testid="fixture-feed">
    <div class="social" data-testid="social-dock"><span></span><span></span><span></span><span></span></div>
    <div class="chrome" data-testid="bottom-chrome">
      <p class="summary" data-testid="summary">Uzun özet satırı bir. İki. Üç. Dört. Beşinci satır clamp dışında kalmalı ve rail görünür kalmalı. Altıncı da.</p>
      <div data-testid="discovery-slot">
        <div class="hl-row">
          <h3 class="hl-title">Yerel Yaşamda Öne Çıkanlar</h3>
          <button class="see" type="button">Tümünü Gör ›</button>
        </div>
        <div class="rail" data-testid="rail">
          <article class="tile" data-testid="tile"><div class="media"></div><div class="meta"><div class="cat">YEREL YAŞAM</div><p class="tile-hl">Kart bir başlık iki satıra kadar</p></div></article>
          <article class="tile" data-testid="tile"><div class="media"></div><div class="meta"><div class="cat">YEREL YAŞAM</div><p class="tile-hl">Kart iki başlık örneği</p></div></article>
          <article class="tile" data-testid="tile"><div class="media"></div><div class="meta"><div class="cat">YEREL YAŞAM</div><p class="tile-hl">Kart üç kısmi görünür</p></div></article>
        </div>
      </div>
      <button class="cta" type="button" data-testid="haberi-oku">Haberi Oku</button>
    </div>
  </div>
  <script>
    function measure() {
      const feed = document.querySelector('[data-testid="fixture-feed"]')
      const chrome = document.querySelector('[data-testid="bottom-chrome"]')
      const rail = document.querySelector('[data-testid="rail"]')
      const tiles = [...document.querySelectorAll('[data-testid="tile"]')]
      const social = document.querySelector('[data-testid="social-dock"]')
      const cta = document.querySelector('[data-testid="haberi-oku"]')
      const summary = document.querySelector('[data-testid="summary"]')
      const chromeW = chrome.clientWidth
      const contentW = chromeW - 56 // approx social pr 3.5rem
      const tileW = tiles[0].getBoundingClientRect().width
      const visible = chromeW / (tileW + 10)
      const socialRect = social.getBoundingClientRect()
      const railRect = rail.getBoundingClientRect()
      const out = {
        viewport: { w: innerWidth, h: innerHeight },
        feedWidth: feed.clientWidth,
        chromeWidth: chromeW,
        socialColumnApproxPx: 56,
        contentSafeWidth: contentW,
        summaryClampLines: 4,
        summaryLineHeight: getComputedStyle(summary).lineHeight,
        cardWidth: Math.round(tileW),
        cardHeight: Math.round(tiles[0].getBoundingClientRect().height),
        image: { w: Math.round(tileW), h: Math.round(tileW * 10/16), aspect: '1.6' },
        gap: 10,
        visibleCardEstimate: Number(visible.toFixed(2)),
        partialThirdPct: Math.round(Math.max(0, (visible - 2) * 100)),
        railRight: Math.round(railRect.right),
        socialLeft: Math.round(socialRect.left),
        railClearsSocial: railRect.right <= socialRect.left + 1,
        ctaTop: Math.round(cta.getBoundingClientRect().top),
        ctaVisible: cta.getBoundingClientRect().bottom <= innerHeight,
      }
      document.getElementById('out').textContent = JSON.stringify(out, null, 2)
    }
    requestAnimationFrame(() => requestAnimationFrame(measure))
    addEventListener('resize', measure)
  </script>
</body>
</html>
