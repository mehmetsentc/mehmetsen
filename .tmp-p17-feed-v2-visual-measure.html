<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P17 Feed V2 measure — blur bg + fg hero</title>
  <style>
    body { margin:0; background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; padding:16px; }
    h1 { font-size:1rem; margin:0 0 12px; }
    .row { display:flex; flex-wrap:wrap; gap:16px; }
    .phone {
      width: 390px; height: 844px; border-radius: 28px; overflow:hidden; position:relative;
      border:1px solid #333; flex-shrink:0;
    }
    .bg { position:absolute; inset:-10%; background-size:cover; background-position:center;
      filter: blur(36px) brightness(.45); transform:scale(1.1); }
    .veil { position:absolute; inset:0;
      background: linear-gradient(180deg,rgba(0,0,0,.5),transparent 28%,rgba(0,0,0,.35) 48%,rgba(0,0,0,.9)); }
    .stack { position:absolute; inset:0; padding: 72px 14px 18px; display:flex; flex-direction:column; }
    .hero { width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden; border:1.5px solid rgba(255,255,255,.28);
      box-shadow:0 14px 36px rgba(0,0,0,.55); flex-shrink:0; }
    .hero img { width:100%; height:100%; object-fit:cover; display:block; }
    .badge { display:inline-block; margin-top:10px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; background:var(--a); }
    .hl { margin:10px 0 0; font-size:1.2rem; font-weight:800; line-height:1.22; }
    .sum { margin:10px 0 0; font-size:.95rem; font-weight:500; line-height:1.45; }
    .sum.clamp4 { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
    .rail { margin-top:12px; }
    .rail h3 { font-size:12px; margin:0 0 8px; }
    .rail-row { display:flex; gap:10px; overflow:hidden; }
    .mini { width: calc((100% - 10px)/2.2); flex-shrink:0; border-radius:12px; overflow:hidden; background:#111; }
    .mini .m { aspect-ratio:16/10; background:#333; background-size:cover; }
    .mini p { margin:0; padding:8px; font-size:11px; font-weight:700; line-height:1.3; }
    .cta { margin-top:auto; height:56px; border-radius:999px; border:0; font-weight:800;
      background: color-mix(in srgb, var(--a) 18%, white); }
    .meta { font-size:11px; color:#aaa; margin-top:8px; }
    .label { font-size:12px; color:#a1a1aa; margin-bottom:6px; }
  </style>
</head>
<body>
  <h1>P17 measure fixtures (implementation mirror)</h1>
  <div class="row">
    <div>
      <div class="label">A — WITHOUT Highlights · bright</div>
      <div class="phone" style="--a:#e11d2e" id="a" data-case="no-hl-bright"></div>
    </div>
    <div>
      <div class="label">B — WITH Highlights · busy</div>
      <div class="phone" style="--a:#06b6d4" id="b" data-case="with-hl-busy"></div>
    </div>
    <div>
      <div class="label">C — bright readability</div>
      <div class="phone" style="--a:#16a34a" id="c" data-case="bright"></div>
    </div>
    <div>
      <div class="label">E — short viewport 640×560</div>
      <div class="phone" style="--a:#2563eb;width:390px;height:560px" id="e" data-case="short"></div>
    </div>
  </div>
  <pre id="report" class="meta" style="margin-top:16px;white-space:pre-wrap"></pre>
  <script>
    const photos = {
      bright: 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=1200&q=80&auto=format&fit=crop',
      busy: 'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=1200&q=80&auto=format&fit=crop',
      sport: 'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1200&q=80&auto=format&fit=crop',
    }
    function mount(el, { photo, accentLabel, headline, summary, hl, short }) {
      el.innerHTML = `
        <div class="bg" style="background-image:url('${photo}')"></div>
        <div class="veil"></div>
        <div class="stack">
          <div class="hero"><img src="${photo}" alt="" /></div>
          <div><span class="badge">${accentLabel}</span></div>
          <h2 class="hl">${headline}</h2>
          <p class="sum ${hl ? 'clamp4' : ''}">${summary}</p>
          ${hl ? `<div class="rail" data-hl="1">
            <h3>Teknolojide Öne Çıkanlar</h3>
            <div class="rail-row">
              <div class="mini"><div class="m" style="background-image:url('${photo}')"></div><p>İlgili haber bir</p></div>
              <div class="mini"><div class="m" style="background-image:url('${photos.sport}')"></div><p>İlgili haber iki</p></div>
              <div class="mini"><div class="m" style="background-image:url('${photos.bright}')"></div><p>Kısmi üçüncü</p></div>
            </div>
          </div>` : ''}
          <button class="cta" type="button">Haberi Oku</button>
          <div class="meta">Örnek Yayın · Takip Et · short=${!!short} hl=${!!hl}</div>
        </div>`
    }
    mount(document.getElementById('a'), {
      photo: photos.bright, accentLabel: 'GÜNDEM', hl: false,
      headline: 'Manşet tam görünür: kesilmeyen başlık örneği',
      summary: 'Özet tam ve yüksek kontrast. Buğulu arka plan üzerinde net okunur. Highlights yok — boş rail bırakılmaz.',
    })
    mount(document.getElementById('b'), {
      photo: photos.busy, accentLabel: 'TEKNOLOJİ', hl: true,
      headline: 'Highlights eligible kart: özet 4 satır clamp',
      summary: 'Özet satırları rail ve Haberi Oku için yer bırakır. Yatay 2.2 kart kuralı: iki tam + kısmi üçüncü görünür. Cadence her 8. kart.',
    })
    mount(document.getElementById('c'), {
      photo: photos.bright, accentLabel: 'SPOR', hl: false,
      headline: 'Parlak görsel okunabilirlik testi',
      summary: 'Koyu veil + gradient sayesinde beyaz manşet/özet parlak foto üzerinde okunur kalır.',
    })
    mount(document.getElementById('e'), {
      photo: photos.sport, accentLabel: 'EKONOMİ', hl: false, short: true,
      headline: 'Kısa viewport: Highlights suppress',
      summary: 'viewportHeight < 640 → shouldShowFeedHighlights short-viewport. Core metin korunur.',
    })
    const aHero = document.querySelector('#a .hero')
    const bMini = document.querySelectorAll('#b .mini')
    const report = {
      viewportA: '390x844',
      fgHeroAspect: '16/9',
      fgTopApprox: '72px below top (top-clearance)',
      bgBlur: 'CSS filter blur(36px) + brightness — same URL',
      duplicateFetch: 'same src for bg+fg; browser/Next cache reuse',
      summaryClampWithHl: 4,
      highlightsCadence: 8,
      shortViewportSuppress: 640,
      railVisibleCards: 2.2,
      miniCount: bMini.length,
      fgWidth: aHero?.clientWidth,
      fgHeight: aHero?.clientHeight,
    }
    document.getElementById('report').textContent = JSON.stringify(report, null, 2)
  </script>
</body>
</html>
